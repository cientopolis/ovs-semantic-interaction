<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVS Test - Inspector de Componentes Visuales</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- React & ReactDOM (UMD - Production) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- HTM (Hyperscript Tagged Markup) -->
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
    
    <!-- Estilos de la aplicación -->
    <link rel="stylesheet" href="/src/style.css">
    
    <style>
        /* Base styles for test page */
        body, html {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-primary);
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .test-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .test-header {
            height: 70px;
            padding: 0 24px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .test-body {
            display: flex;
            flex: 1;
            height: calc(100% - 70px);
        }

        .test-sidebar {
            width: 280px;
            background-color: var(--bg-surface-solid);
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .test-content {
            flex: 1;
            padding: 30px;
            background-color: var(--bg-base);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .test-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .grid-widget {
            background-color: var(--bg-surface-solid);
            border: 1px solid var(--border-light);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        /* --- DEV INSPECTOR MODE CLASSES --- */
        
        /* Outline effect on inspectable elements when Dev Mode is active */
        .dev-mode-active [data-dev-id] {
            position: relative !important;
            outline: 2px dashed #b500fa !important;
            cursor: help !important;
            transition: outline-color 0.2s ease;
        }

        .dev-mode-active [data-dev-id]:hover {
            outline: 2px solid #e040fb !important;
            background-color: rgba(224, 64, 251, 0.04) !important;
        }

        /* Floating identification badge on hover */
        .dev-mode-active [data-dev-id]::before {
            content: attr(data-dev-id) " (" attr(data-dev-component) ")";
            position: absolute;
            top: -22px;
            left: 2px;
            background: #b500fa;
            color: white;
            font-family: monospace;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 9999;
            pointer-events: none;
            box-shadow: var(--shadow-sm);
            white-space: nowrap;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        /* Custom Alias styling (Green badge) */
        .dev-mode-active [data-dev-custom-name]::before {
            content: attr(data-dev-id) " (" attr(data-dev-custom-name) ")";
            background: #00e676;
            color: #000000;
        }

        .dev-mode-active [data-dev-custom-name] {
            outline: 2px dashed #00e676 !important;
        }

        .dev-mode-active [data-dev-custom-name]:hover {
            outline: 2px solid #00e676 !important;
            background-color: rgba(0, 230, 118, 0.04) !important;
        }

        .dev-mode-active [data-dev-id]:hover::before {
            opacity: 1;
        }

        /* M3 switch styles for header */
        .dev-mode-toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background-color: var(--bg-surface);
            border-radius: 100px;
            border: 1px solid var(--border-color);
        }

        .md-switch-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .md-switch-label .dev-icon {
            font-size: 16px;
            color: var(--accent-primary);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-primary);
        }

        input:checked + .slider:before {
            transform: translateX(16px);
            background-color: #000;
        }

        /* Material Dialog Overlay */
        .md-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20000;
        }

        .md-dialog-card {
            background-color: var(--bg-surface-solid);
            border-radius: 24px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .md-dialog-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }

        .md-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .md-input-group label {
            font-weight: 600;
            font-size: 11px;
            color: var(--accent-primary);
            text-transform: uppercase;
        }

        .md-text-field {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-base);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .md-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .md-btn {
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .md-btn-text {
            background: transparent;
            color: var(--text-secondary);
        }

        .md-btn-filled {
            background-color: var(--accent-primary);
            color: #000;
        }
        
        .md-btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const html = htm.bind(React.createElement);

        function DevInspectorTest() {
            const [devMode, setDevMode] = React.useState(() => localStorage.getItem('devModeActive') === 'true');
            const [activeDialog, setActiveDialog] = React.useState(null); // { id, component, customName }
            const [customNames, setCustomNames] = React.useState({});
            const [dialogInput, setDialogInput] = React.useState('');

            // Apply body class when devMode changes
            React.useEffect(() => {
                if (devMode) {
                    document.body.classList.add('dev-mode-active');
                } else {
                    document.body.classList.remove('dev-mode-active');
                }
                localStorage.setItem('devModeActive', devMode);
            }, [devMode]);

            // Load custom names from localStorage on mount
            React.useEffect(() => {
                const keys = Object.keys(localStorage);
                const names = {};
                keys.forEach(k => {
                    if (k.startsWith('dev-name-')) {
                        names[k.replace('dev-name-', '')] = localStorage.getItem(k);
                    }
                });
                setCustomNames(names);
            }, []);

            // Intercept clicks on inspectable items
            const handleInspectClick = (e, id, component) => {
                if (!devMode) return;
                
                // Prevent trigger native clicks
                e.preventDefault();
                e.stopPropagation();

                const currentVal = customNames[id] || '';
                setActiveDialog({ id, component, customName: currentVal });
                setDialogInput(currentVal);
            };

            const handleSaveAlias = () => {
                if (!activeDialog) return;
                const { id } = activeDialog;
                
                if (dialogInput.trim()) {
                    localStorage.setItem(`dev-name-${id}`, dialogInput.trim());
                    setCustomNames(prev => ({ ...prev, [id]: dialogInput.trim() }));
                } else {
                    localStorage.removeItem(`dev-name-${id}`);
                    setCustomNames(prev => {
                        const updated = { ...prev };
                        delete updated[id];
                        return updated;
                    });
                }
                setActiveDialog(null);
            };

            const handleResetAlias = () => {
                if (!activeDialog) return;
                const { id } = activeDialog;
                localStorage.removeItem(`dev-name-${id}`);
                setCustomNames(prev => {
                    const updated = { ...prev };
                    delete updated[id];
                    return updated;
                });
                setActiveDialog(null);
            };

            // Lighter helper to return dev properties
            const getDevProps = (id, component) => {
                const customName = customNames[id];
                return {
                    'data-dev-id': id,
                    'data-dev-component': component,
                    'data-dev-custom-name': customName || undefined,
                    onClick: (e) => handleInspectClick(e, id, component)
                };
            };

            return html`
                <div class="test-layout">
                    <!-- Header -->
                    <header class="test-header">
                        <div style=${{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                            <i class="fa-solid fa-bug" style=${{ color: 'var(--accent-primary)', fontSize: '20px' }}></i>
                            <span style=${{ fontWeight: 700, fontSize: '18px' }}>Inspector Visual Test</span>
                        </div>
                        
                        <div class="dev-mode-toggle-container">
                            <label class="md-switch-label" for="dev-mode-checkbox">
                                <span class="material-symbols-outlined dev-icon">bug_report</span>
                                <span>Modo Dev</span>
                            </label>
                            <label class="switch">
                                <input 
                                    type="checkbox" 
                                    id="dev-mode-checkbox" 
                                    checked=${devMode}
                                    onChange=${(e) => setDevMode(e.target.checked)}
                                />
                                <span class="slider"></span>
                            </label>
                        </div>
                    </header>

                    <!-- Body -->
                    <div class="test-body">
                        <!-- Sidebar -->
                        <aside class="test-sidebar" ...${getDevProps('#testSidebar', 'Barra Lateral de Filtros')}>
                            <h3>Filtros de Prueba</h3>
                            <p style=${{ fontSize: '13px', color: 'var(--text-secondary)' }}>
                                En Modo Dev, pase el mouse por encima de este panel para ver su ID y etiqueta flotante.
                            </p>
                            <p style=${{ fontSize: '13px', color: 'var(--text-secondary)' }}>
                                Haga clic para renombrar o añadir un alias personalizado.
                            </p>
                        </aside>

                        <!-- Content Workspace -->
                        <main class="test-content" ...${getDevProps('#testContent', 'Espacio de Trabajo Principal')}>
                            <h2>Panel de Control General</h2>
                            
                            <div class="grid-layout">
                                <div class="grid-widget" ...${getDevProps('#statsWidget1', 'Métrica de Tráfico')}>
                                    <h4 style=${{ color: 'var(--text-muted)', fontSize: '11px', textTransform: 'uppercase' }}>Visitas</h4>
                                    <span style=${{ fontSize: '24px', fontWeight: 700 }}>2,845</span>
                                </div>
                                <div class="grid-widget" ...${getDevProps('#statsWidget2', 'Métrica de Rendimiento')}>
                                    <h4 style=${{ color: 'var(--text-muted)', fontSize: '11px', textTransform: 'uppercase' }}>Latencia</h4>
                                    <span style=${{ fontSize: '24px', fontWeight: 700 }}>34 ms</span>
                                </div>
                            </div>

                            <div class="test-card" ...${getDevProps('#chartsCard', 'Card de Gráficos de Suelo')}>
                                <h3>Distribución de Suelo</h3>
                                <p style=${{ fontSize: '13px', color: 'var(--text-muted)' }}>
                                    Pase el mouse aquí para inspeccionar esta sección específica.
                                </p>
                            </div>
                        </main>
                    </div>

                    <!-- Rename Modal Dialog -->
                    ${activeDialog && html`
                        <div class="md-dialog-overlay">
                            <div class="md-dialog-card">
                                <h3 class="md-dialog-title">
                                    <i class="fa-solid fa-tags" style=${{ color: 'var(--accent-primary)' }}></i>
                                    Renombrar Componente
                                </h3>
                                <div style=${{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                                    <p style=${{ fontSize: '13px', color: 'var(--text-secondary)', margin: 0 }}>
                                        Asigne un alias personalizado para facilitar la identificación de este elemento:
                                    </p>
                                    
                                    <div class="md-input-group">
                                        <label>Alias Personalizado:</label>
                                        <input 
                                            type="text" 
                                            class="md-text-field" 
                                            value=${dialogInput}
                                            onChange=${(e) => setDialogInput(e.target.value)}
                                            placeholder="Ej. #chartsCard (Sección Gráficos)"
                                            autoFocus
                                        />
                                    </div>
                                    
                                    <div style=${{ fontSize: '12px', color: 'var(--text-muted)' }}>
                                        <div><strong>ID Original:</strong> ${activeDialog.id}</div>
                                        <div><strong>Nombre original:</strong> ${activeDialog.component}</div>
                                    </div>
                                </div>

                                <div class="md-dialog-actions">
                                    <button class="md-btn md-btn-text" onClick=${() => setActiveDialog(null)}>Cancelar</button>
                                    ${activeDialog.customName && html`
                                        <button class="md-btn md-btn-danger" onClick=${handleResetAlias}>Restablecer</button>
                                    `}
                                    <button class="md-btn md-btn-filled" onClick=${handleSaveAlias}>Guardar</button>
                                </div>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${DevInspectorTest} />`);
    </script>
</body>
</html>
