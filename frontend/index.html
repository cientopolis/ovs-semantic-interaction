<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVS GeoAnalytics - Análisis Espacial Inmobiliario</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Leaflet.js para mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Vis.js Network para el Inspector de Grafo de Conocimiento -->
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    
    <!-- React & ReactDOM (UMD - Production) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- HTM (Hyperscript Tagged Markup) - Bypasses Babel to run React natively without any compiler errors -->
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
    
    <!-- Estilos de la aplicación -->
    <link rel="stylesheet" href="/src/style.css">
    
    <style>
        /* CSS overrides for React GIS app to look spectacular and premium */
        #root {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-primary);
        }
        
        /* Modern Header styling */
        .react-header {
            height: 70px;
            padding: 0 24px;
            background-color: var(--header-bg);
            backdrop-filter: blur(var(--glass-blur));
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-primary);
            font-size: 20px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-logo i {
            font-size: 24px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .repo-select-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 100px;
        }

        .repo-select-container label {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .repo-select {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            padding-right: 4px;
        }

        .repo-select option {
            background-color: var(--bg-surface-solid);
            color: var(--text-primary);
        }
        
        .header-center {
            display: flex;
            background-color: var(--bg-surface-hover);
            padding: 4px;
            border-radius: 100px;
            border: 1px solid var(--border-color);
        }
        
        .view-toggle-btn {
            padding: 8px 20px;
            border-radius: 100px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            background: transparent;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .view-toggle-btn.active {
            background-color: var(--accent-primary);
            color: #000000;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .view-toggle-btn.active i {
            color: #000000;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .badge-count {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .theme-selector {
            display: flex;
            background-color: var(--bg-surface-hover);
            padding: 4px;
            border-radius: 100px;
            border: 1px solid var(--border-color);
            gap: 2px;
        }

        .theme-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .theme-btn.active {
            background-color: var(--bg-surface-solid);
            color: var(--accent-primary);
            box-shadow: var(--shadow-sm);
        }
        
        /* Layout structures */
        .workspace-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100% - 70px);
            display: flex;
        }
        
        /* Map Workspace Layout with Floating Controls */
        .map-workspace {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .leaflet-container {
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
        }
        
        /* Kepler style sidebar overlay */
        .kepler-sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            max-height: calc(100% - 40px);
            background-color: var(--bg-surface);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border-color);
            border-radius: 16px;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .kepler-sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.1);
        }
        
        .kepler-sidebar-header h3 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .kepler-sidebar-header h3 i {
            color: var(--accent-primary);
        }
        
        .kepler-sidebar-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }
        
        .control-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .control-section h4 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.75px;
            color: var(--accent-primary);
            margin: 0;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 6px;
        }
        
        .layer-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .layer-toggle:hover {
            background-color: var(--bg-surface-hover);
            border-color: var(--border-color);
        }
        
        .layer-toggle span {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .layer-toggle input[type="checkbox"] {
            accent-color: var(--accent-primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        /* Filter Styles */
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .filter-slider {
            width: 100%;
            accent-color: var(--accent-primary);
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        
        /* High density table styles */
        .table-workspace {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background-color: var(--bg-base);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .kg-inspector-workspace {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            background-color: var(--bg-base);
            flex-direction: column;
            overflow: hidden;
        }
        
        .table-toolbar {
            padding: 16px 24px;
            background-color: var(--bg-surface-solid);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        
        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 400px;
        }
        
        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .table-search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 100px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }
        
        .table-search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        .grid-container {
            flex: 1;
            overflow: auto;
            width: 100%;
        }
        
        .premium-grid {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }
        
        .premium-grid th {
            position: sticky;
            top: 0;
            background-color: var(--table-header-bg);
            color: var(--text-primary);
            font-weight: 600;
            padding: 14px 20px;
            border-bottom: 2px solid var(--border-color);
            z-index: 10;
            user-select: none;
            cursor: pointer;
        }
        
        .premium-grid th:hover {
            color: var(--accent-primary);
        }
        
        .premium-grid td {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .premium-grid tr:nth-child(even) {
            background-color: var(--table-row-alternate);
        }
        
        .premium-grid tr:hover {
            background-color: var(--bg-surface-hover);
        }
        
        .editable-cell {
            cursor: double-click;
            position: relative;
            background-color: rgba(0, 229, 255, 0.02);
            transition: background-color 0.2s ease;
        }
        
        .editable-cell:hover {
            background-color: rgba(0, 229, 255, 0.08) !important;
            outline: 1px dashed var(--accent-primary);
        }
        
        .cell-edit-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--accent-primary);
            background-color: var(--input-bg);
            color: var(--text-primary);
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            box-shadow: 0 0 6px var(--accent-glow);
        }
        
        .cell-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge-residencial {
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        .badge-comercial {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .badge-baldio {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .leaflet-popup-content-wrapper {
            background-color: var(--bg-surface-solid) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px !important;
        }

        .leaflet-popup-tip {
            background-color: var(--bg-surface-solid) !important;
        }

        .lock-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            gap: 16px;
            padding: 40px;
            text-align: center;
        }

        .lock-indicator i {
            font-size: 48px;
            color: var(--accent-primary);
            text-shadow: 0 0 10px var(--accent-glow);
        }
        
        .lock-indicator h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .lock-indicator p {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 320px;
            margin: 0;
        }

        /* --- DEV INSPECTOR MODE CLASSES --- */
        
        /* Outline effect on inspectable elements when Dev Mode is active */
        .dev-mode-active [data-dev-id] {
            position: relative !important;
            outline: 2px dashed #b500fa !important;
            cursor: help !important;
            transition: outline-color 0.2s ease;
        }

        .dev-mode-active [data-dev-id]:hover {
            outline: 2px solid #e040fb !important;
            background-color: rgba(224, 64, 251, 0.04) !important;
        }

        /* Floating identification badge on hover */
        .dev-mode-active [data-dev-id]::before {
            content: attr(data-dev-id) " (" attr(data-dev-component) ")";
            position: absolute;
            top: -22px;
            left: 2px;
            background: #b500fa;
            color: white;
            font-family: monospace;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 9999;
            pointer-events: none;
            box-shadow: var(--shadow-sm);
            white-space: nowrap;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        /* Custom Alias styling (Green badge) */
        .dev-mode-active [data-dev-custom-name]::before {
            content: attr(data-dev-id) " (" attr(data-dev-custom-name) ")";
            background: #00e676;
            color: #000000;
        }

        .dev-mode-active [data-dev-custom-name] {
            outline: 2px dashed #00e676 !important;
        }

        .dev-mode-active [data-dev-custom-name]:hover {
            outline: 2px solid #00e676 !important;
            background-color: rgba(0, 230, 118, 0.04) !important;
        }

        .dev-mode-active [data-dev-id]:hover::before {
            opacity: 1;
        }

        /* M3 switch styles for header */
        .dev-mode-toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background-color: var(--bg-surface);
            border-radius: 100px;
            border: 1px solid var(--border-color);
        }

        .md-switch-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .md-switch-label .dev-icon {
            font-size: 16px;
            color: var(--accent-primary);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-primary);
        }

        input:checked + .slider:before {
            transform: translateX(16px);
            background-color: #000;
        }

        /* Material Dialog Overlay */
        .md-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20000;
        }

        .md-dialog-card {
            background-color: var(--bg-surface-solid);
            border-radius: 24px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .md-dialog-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }

        .md-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .md-input-group label {
            font-weight: 600;
            font-size: 11px;
            color: var(--accent-primary);
            text-transform: uppercase;
        }

        .md-text-field {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-base);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .md-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .md-btn {
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .md-btn-text {
            background: transparent;
            color: var(--text-secondary);
        }

        .md-btn-filled {
            background-color: var(--accent-primary);
            color: #000;
        }
        
        .md-btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* --- USER MENU PREMIUM STYLES --- */
        .user-menu-container {
            position: relative;
        }

        .user-menu-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .user-menu-btn:hover {
            background-color: var(--bg-surface-hover);
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .user-menu-btn.active {
            background-color: var(--bg-surface-solid);
            border-color: var(--accent-primary);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 700;
            font-size: 12px;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-chevron {
            font-size: 10px;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .user-menu-btn.active .user-chevron {
            transform: rotate(180deg);
            color: var(--accent-primary);
        }

        /* Dropdown Panel */
        .user-dropdown-panel {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 240px;
            background-color: var(--bg-surface-solid);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform-origin: top right;
            animation: slideDownFade 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
        }

        @keyframes slideDownFade {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(-8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .dropdown-header-info {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dropdown-info-text {
            display: flex;
            flex-direction: column;
        }

        .dropdown-info-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .dropdown-info-role {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dropdown-menu-list {
            list-style: none;
            padding: 8px 0;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;

        // Helper to match coords to closest neighborhood
        function getNeighborhoodFromCoords(lat, lng) {
            let closest = 'La Plata Centro';
            let minDist = Infinity;
            
            Object.entries(NEIGHBORHOODS).forEach(([name, data]) => {
                const d = Math.pow(lat - data.lat, 2) + Math.pow(lng - data.lng, 2);
                if (d < minDist) {
                    minDist = d;
                    closest = name;
                }
            });
            return closest;
        }

        // Helper to parse WKT POINT(X Y) -> [lat, lng]
        function parseWKT(coordStr) {
            if (!coordStr) return null;
            let cleanStr = coordStr.trim().replace(/<[^>]+>\s*/g, '').trim();
            const wktRegex = /POINT\s*\(\s*([-\d.]+)\s+([-\d.]+)\s*\)/i;
            const match = cleanStr.match(wktRegex);
            if (match) {
                const val1 = parseFloat(match[1]); // lon or lat
                const val2 = parseFloat(match[2]); // lat or lon
                
                // Argentina bounds: Latitud [-56, -20], Longitud [-74, -53]
                // standard: val1 = lon (~ -58), val2 = lat (~ -34) -> returns [val2, val1]
                if (val1 < -50 && val1 > -75 && val2 < -20 && val2 > -57) {
                    return [val2, val1];
                }
                // reversed: val1 = lat (~ -34), val2 = lon (~ -58) -> returns [val1, val2]
                if (val2 < -50 && val2 > -75 && val1 < -20 && val1 > -57) {
                    return [val1, val2];
                }
                
                // Default fallback: WKT Standard ordering (lon, lat) -> Leaflet expects (lat, lon)
                return [val2, val1];
            }
            const parts = cleanStr.split(/[\s,]+/);
            if (parts.length >= 2) {
                const val1 = parseFloat(parts[0]);
                const val2 = parseFloat(parts[1]);
                if (!isNaN(val1) && !isNaN(val2)) {
                    if (val1 < -50 && val1 > -75 && val2 < -20 && val2 > -57) {
                        return [val2, val1];
                    }
                    return [val1, val2];
                }

                    'data-dev-id': id,
                    'data-dev-component': component,
                    'data-dev-custom-name': customName || undefined,
                    onClick: (e) => handleInspectClick(e, id, component)
                };
            };
            
            // Map Layers Toggle State
            const [layers, setLayers] = React.useState({
                points: true,
                heatmap: false,
                hexbin: false,
                choropleth: true,
                extrusion3D: false
            });
            
            // Filter Range States
            const [priceFilter, setPriceFilter] = React.useState(1500000);
            const [areaFilter, setAreaFilter] = React.useState(50);
            
            // Sorting & Editing states
            const [sortField, setSortField] = React.useState('id');
            const [sortDirection, setSortDirection] = React.useState('asc');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [editingCell, setEditingCell] = React.useState(null); // { id, field }
            const [editValue, setEditValue] = React.useState('');

            // Refs
            const leafletMapRef = React.useRef(null);
            const mapContainerRef = React.useRef(null);
            const tileLayerRef = React.useRef(null);
            const layersGroupRef = React.useRef(null);

            // Set HTML attribute for theme
            React.useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('appTheme', theme);
                
                // Update basemap if Leaflet map exists
                if (tileLayerRef.current && leafletMapRef.current) {
                    tileLayerRef.current.setUrl(THEME_MAP_STYLES[theme]);
                }
            }, [theme]);

            // Fetch Repositories on mount
            React.useEffect(() => {
                fetch('/api/repositories')
                    .then(res => res.json())
                    .then(repos => {
                        setRepositories(repos);
                        if (repos.length > 0) {
                            const saved = localStorage.getItem('activeRepository');
                            const initial = saved && repos.some(r => r.id === saved) ? saved : repos[0].id;
                            setActiveRepo(initial);
                            localStorage.setItem('activeRepository', initial);
                        }
                    })
                    .catch(err => console.error("Error fetching repositories:", err));
            }, []);

            // Fetch Geolocalized Entities when active repository changes
            React.useEffect(() => {
                if (!activeRepo) return;
                localStorage.setItem('activeRepository', activeRepo);
                
                fetch(`/api/sparql/entities/${activeRepo}/geolocalized`)
                    .then(res => res.json())
                    .then(entities => {
                        const parsed = entities.map((ent, idx) => {
                            const parsedCoords = parseWKT(ent.coords || ent.coordinates);
                            const lat = parsedCoords ? parsedCoords[0] : -34.6 + (Math.random() - 0.5) * 0.1;
                            const lng = parsedCoords ? parsedCoords[1] : -58.4 + (Math.random() - 0.5) * 0.1;
                            const label = ent.label || ent.entity.split('#').pop().split('/').pop();
                            
                            // Deterministic mock variables for soil value/area based on coordinates or index
                            const area = 50 + Math.floor((Math.abs(lat) * 1000) % 250);
                            const valorSuelo = 100000 + Math.floor((Math.abs(lng) * 10000) % 900) * 1500;
                            const destino = idx % 3 === 0 ? 'Residencial' : (idx % 3 === 1 ? 'Comercial' : 'Baldío');
                            const barrio = getNeighborhoodFromCoords(lat, lng);
                            
                            return {
                                id: `PRC-${idx.toString().padStart(3, '0')}`,
                                entity: ent.entity,
                                label,
                                type: ent.type,
                                barrio,
                                area,
                                valorSuelo,
                                destino,
                                lat,
                                lng
                            };
                        });
                        setData(parsed);
                        
                        // Centrar mapa si hay elementos
                        if (parsed.length > 0 && leafletMapRef.current) {
                            const validCoords = parsed.map(p => [p.lat, p.lng]);
                            const bounds = L.latLngBounds(validCoords);
                            if (bounds.isValid()) {
                                leafletMapRef.current.fitBounds(bounds, { padding: [40, 40] });
                            }
                        }
                    })
                    .catch(err => {
                        console.error("Error fetching geolocalized entities:", err);
                        setData([]);
                    });
            }, [activeRepo]);

            // Initialize Leaflet map
            React.useEffect(() => {
                if (!mapContainerRef.current) return;
                
                const map = L.map(mapContainerRef.current, {
                    center: [-34.5882, -58.3974],
                    zoom: 12,
                    zoomControl: false
                });
                
                L.control.zoom({ position: 'topright' }).addTo(map);
                
                const tile = L.tileLayer(THEME_MAP_STYLES[theme], {
                    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
                }).addTo(map);
                
                const layersGroup = L.layerGroup().addTo(map);
                
                leafletMapRef.current = map;
                tileLayerRef.current = tile;
                layersGroupRef.current = layersGroup;

                return () => {
                    map.remove();
                    leafletMapRef.current = null;
                    tileLayerRef.current = null;
                    layersGroupRef.current = null;
                };
            }, []);

            // Redraw layers when variables, selections or options change
            React.useEffect(() => {
                if (!leafletMapRef.current || !layersGroupRef.current) return;
                
                const layersGroup = layersGroupRef.current;
                layersGroup.clearLayers();
                
                // Filtered records
                const filtered = data.filter(item => {
                    const matchesSearch = item.label.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          item.barrio.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesPrice = item.valorSuelo <= priceFilter;
                    const matchesArea = item.area >= areaFilter;
                    return matchesSearch && matchesPrice && matchesArea;
                });

                // Calculate averages per Neighborhood for Choropleth / 3D Extrusions
                const neighborhoodStats = {};
                filtered.forEach(item => {
                    if (!neighborhoodStats[item.barrio]) {
                        neighborhoodStats[item.barrio] = { count: 0, totalPrice: 0, totalArea: 0 };
                    }
                    neighborhoodStats[item.barrio].count++;
                    neighborhoodStats[item.barrio].totalPrice += item.valorSuelo;
                    neighborhoodStats[item.barrio].totalArea += item.area;
                });
                
                Object.keys(neighborhoodStats).forEach(name => {
                    const stats = neighborhoodStats[name];
                    stats.avgM2Price = stats.totalArea > 0 ? Math.round(stats.totalPrice / stats.totalArea) : 0;
                });

                // Render Layers in order
                
                // 1. Choropleth Layer
                if (layers.choropleth) {
                    Object.entries(NEIGHBORHOODS).forEach(([name, neigh]) => {
                        const stats = neighborhoodStats[name];
                        const avgPrice = stats ? stats.avgM2Price : 0;
                        
                        // Color scale based on avg value per m2
                        let color = '#cbd5e1'; // transparent fallback
                        let fillOpacity = 0.05;
                        
                        if (avgPrice > 0) {
                            fillOpacity = 0.5;
                            if (avgPrice < 1500) color = '#c084fc'; // low value
                            else if (avgPrice < 3500) color = '#818cf8'; // medium
                            else color = '#38bdf8'; // high
                        }
                        
                        const polygon = L.polygon(neigh.bounds, {
                            color: neigh.color,
                            weight: 2,
                            fillColor: color,
                            fillOpacity: fillOpacity,
                            dashArray: '4'
                        });
                        
                        polygon.bindPopup(`
                            <div style="font-family: sans-serif; padding: 4px;">
                                <h4 style="margin: 0 0 6px 0; color: var(--accent-primary)">Barrio: ${name}</h4>
                                <p style="margin: 3px 0 0 0; font-size:12px"><strong>Registros:</strong> ${stats ? stats.count : 0}</p>
                                <p style="margin: 3px 0 0 0; font-size:12px"><strong>Suelo Promedio:</strong> u$s ${stats ? stats.avgM2Price.toLocaleString() : 0} /m²</p>
                            </div>
                        `);
                        
                        layersGroup.addLayer(polygon);
                    });
                }
                
                // 2. Hexbin Density Layer
                if (layers.hexbin) {
                    // Simple Hexagonal bin calculation (approximate 0.015 lat/lng step size)
                    const step = 0.015;
                    const bins = {};
                    
                    filtered.forEach(item => {
                        const binX = Math.round(item.lng / step);
                        const binY = Math.round(item.lat / (step * 0.866)); // Adjust for hex geometry ratio
                        const key = `${binX}_${binY}`;
                        
                        if (!bins[key]) {
                            bins[key] = { count: 0, lat: binY * step * 0.866, lng: binX * step, points: [] };
                        }
                        bins[key].count++;
                        bins[key].points.push(item);
                    });
                    
                    Object.values(bins).forEach(bin => {
                        // Create regular hexagon polygon centered on bin
                        const hexCorners = [];
                        for (let i = 0; i < 6; i++) {
                            const angle = (i * 60 * Math.PI) / 180;
                            hexCorners.push([
                                bin.lat + (step / 2) * Math.sin(angle),
                                bin.lng + (step / 1.7) * Math.cos(angle)
                            ]);
                        }
                        
                        // Hex color based on item count
                        let fill = '#a78bfa';
                        if (bin.count > 2) fill = '#f43f5e';
                        else if (bin.count > 1) fill = '#fb923c';
                        
                        const hexPoly = L.polygon(hexCorners, {
                            color: 'rgba(255,255,255,0.2)',
                            weight: 1,
                            fillColor: fill,
                            fillOpacity: 0.6
                        });
                        
                        hexPoly.bindPopup(`<strong>Densidad:</strong> ${bin.count} parcelas`);
                        layersGroup.addLayer(hexPoly);
                    });
                }

                // 3. Heatmap Layer
                if (layers.heatmap) {
                    filtered.forEach(item => {
                        const circle = L.circle([item.lat, item.lng], {
                            radius: 300,
                            fillColor: '#ef4444',
                            fillOpacity: 0.25,
                            color: 'transparent'
                        });
                        layersGroup.addLayer(circle);
                    });
                }

                // 4. Points Layer
                if (layers.points) {
                    filtered.forEach(item => {
                        const marker = L.circleMarker([item.lat, item.lng], {
                            radius: 7,
                            fillColor: item.destino === 'Residencial' ? '#3b82f6' : (item.destino === 'Comercial' ? '#10b981' : '#ef4444'),
                            fillOpacity: 0.9,
                            color: '#ffffff',
                            weight: 1.5
                        });
                        
                        marker.bindPopup(`
                            <div style="font-family: sans-serif; padding: 4px;">
                                <h4 style="margin: 0 0 6px 0; font-size:14px; font-weight:600">${item.label}</h4>
                                <p style="margin: 2px 0; font-size:11px"><strong>Barrio:</strong> ${item.barrio}</p>
                                <p style="margin: 2px 0; font-size:11px"><strong>Área:</strong> ${item.area} m²</p>
                                <p style="margin: 2px 0; font-size:11px"><strong>Valor Suelo:</strong> u$s ${item.valorSuelo.toLocaleString()}</p>
                                <p style="margin: 2px 0; font-size:11px"><strong>Destino:</strong> ${item.destino}</p>
                            </div>
                        `);
                        
                        layersGroup.addLayer(marker);
                    });
                }

                // 5. 3D Extrusion Layer (Axonometric pseudo 3D heights)
                if (layers.extrusion3D) {
                    Object.entries(NEIGHBORHOODS).forEach(([name, neigh]) => {
                        const stats = neighborhoodStats[name];
                        if (!stats || stats.count === 0) return;
                        
                        // Shift/offset factor representing simulated 3D axonometric extrusion height
                        const offset = stats.avgM2Price / 100000.0; // scale down
                        
                        const baseBounds = neigh.bounds;
                        // Top polygon bounds shifted
                        const topBounds = [
                            [baseBounds[0][0] + offset, baseBounds[0][1] + offset],
                            [baseBounds[1][0] + offset, baseBounds[1][1] + offset]
                        ];
                        
                        // Draw vertical connection panels for 3D simulation
                        const createVerticalFace = (p1_base, p2_base, p1_top, p2_top) => {
                            return L.polygon([p1_base, p2_base, p2_top, p1_top], {
                                color: 'rgba(0,0,0,0.15)',
                                weight: 1,
                                fillColor: neigh.color,
                                fillOpacity: 0.3
                            });
                        };
                        
                        const cBase = [
                            [baseBounds[0][0], baseBounds[0][1]],
                            [baseBounds[0][0], baseBounds[1][1]],
                            [baseBounds[1][0], baseBounds[1][1]],
                            [baseBounds[1][0], baseBounds[0][1]]
                        ];
                        
                        const cTop = [
                            [topBounds[0][0], topBounds[0][1]],
                            [topBounds[0][0], topBounds[1][1]],
                            [topBounds[1][0], topBounds[1][1]],
                            [topBounds[1][0], topBounds[0][1]]
                        ];

                        // Connect base points to top points
                        for (let i = 0; i < 4; i++) {
                            const next = (i + 1) % 4;
                            layersGroup.addLayer(createVerticalFace(cBase[i], cBase[next], cTop[i], cTop[next]));
                        }

                        // Top cap polygon
                        const topPolygon = L.polygon(cTop, {
                            color: neigh.color,
                            weight: 2,
                            fillColor: '#00e5ff',
                            fillOpacity: 0.5
                        });
                        
                        topPolygon.bindPopup(`<strong>${name} Altura de Suelo Extruida</strong>: ${stats.avgM2Price.toLocaleString()} /m²`);
                        layersGroup.addLayer(topPolygon);
                    });
                }
                
            }, [data, layers, priceFilter, areaFilter, searchQuery]);

            // Dispatch layout resize triggers to prevent Leaflet container clipping
            React.useEffect(() => {
                if (view === 'map') {
                    setTimeout(() => {
                        window.dispatchEvent(new Event('resize'));
                    }, 50);
                }
            }, [view]);

            // Table Inline Editing logic
            const handleCellDoubleClick = (id, field, value) => {
                setEditingCell({ id, field });
                setEditValue(value);
            };

            const handleCellSave = () => {
                if (!editingCell) return;
                
                const { id, field } = editingCell;
                let finalVal = editValue;
                
                if (field === 'area' || field === 'valorSuelo') {
                    finalVal = parseFloat(editValue);
                    if (isNaN(finalVal)) return;
                }
                
                setData(prev => prev.map(item => {
                    if (item.id === id) {
                        return { ...item, [field]: finalVal };
                    }
                    return item;
                }));
                
                setEditingCell(null);
            };

            // Sorting logic
            const handleSort = (field) => {
                const isAsc = sortField === field && sortDirection === 'asc';
                setSortDirection(isAsc ? 'desc' : 'asc');
                setSortField(field);
            };

            // Get processed list
            const sortedData = React.useMemo(() => {
                const filtered = data.filter(item => {
                    const matchesSearch = item.label.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          item.barrio.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesPrice = item.valorSuelo <= priceFilter;
                    const matchesArea = item.area >= areaFilter;
                    return matchesSearch && matchesPrice && matchesArea;
                });
                
                return [...filtered].sort((a, b) => {
                    let aVal = a[sortField];
                    let bVal = b[sortField];
                    
                    if (typeof aVal === 'string') {
                        return sortDirection === 'asc' 
                            ? aVal.localeCompare(bVal) 
                            : bVal.localeCompare(aVal);
                    } else {
                        return sortDirection === 'asc' 
                            ? aVal - bVal 
                            : bVal - aVal;
                    }
                });
            }, [data, sortField, sortDirection, searchQuery, priceFilter, areaFilter]);

            // Layout
            return html`
                <div class="react-header" ...${getDevProps('#reactHeader', 'Encabezado Principal')}>
                    <div class="header-left">
                        <div class="header-logo">
                            <i class="fa-solid fa-layer-group"></i>
                            <span>OVS GeoAnalytics</span>
                        </div>
                        
                        <div class="repo-select-container" ...${getDevProps('#repoSelectContainer', 'Selector de Repositorio')}>
                            <label>Repo:</label>
                            <select 
                                class="repo-select" 
                                value=${activeRepo} 
                                onChange=${(e) => setActiveRepo(e.target.value)}
                            >
                                ${repositories.map(r => html`<option key=${r.id} value=${r.id}>${r.title || r.name || r.id}</option>`)}
                            </select>
                        </div>
                    </div>
                    
                    <div class="header-center" ...${getDevProps('#viewToggle', 'Selector de Vista')}>
                        <button 
                            class="view-toggle-btn ${view === 'map' ? 'active' : ''}" 
                            onClick=${() => setView('map')}
                        >
                            <i class="fa-solid fa-map-location-dot"></i>
                            Mapa
                        </button>
                        <button 
                            class="view-toggle-btn ${view === 'table' ? 'active' : ''}" 
                            onClick=${() => setView('table')}
                        >
                            <i class="fa-solid fa-table-list"></i>
                            Tabla
                        </button>
                        <button 
                            class="view-toggle-btn ${view === 'graph' ? 'active' : ''}" 
                            onClick=${() => setView('graph')}
                        >
                            <i class="fa-solid fa-diagram-project"></i>
                            Grafo KG
                        </button>
                    </div>
                    
                    <div class="header-right">
                        <div class="badge-count" ...${getDevProps('#recordCount', 'Contador de Registros')}>
                            ${sortedData.length} Registros
                        </div>
                        
                        <div class="dev-mode-toggle-container" onClick=${(e) => e.stopPropagation()}>
                            <label class="md-switch-label" htmlFor="dev-mode-checkbox">
                                <i class="fa-solid fa-bug dev-icon"></i>
                                <span>Modo Dev</span>
                            </label>
                            <label class="switch">
                                <input 
                                    type="checkbox" 
                                    id="dev-mode-checkbox" 
                                    checked=${devMode}
                                    onChange=${(e) => setDevMode(e.target.checked)}
                                />
                                <span class="slider"></span>
                            </label>
                        </div>
                        
                        <div class="theme-selector" ...${getDevProps('#themeSelector', 'Selector de Tema')}>
                            <button 
                                class="theme-btn ${theme === 'dark' ? 'active' : ''}" 
                                onClick=${() => setTheme('dark')}
                                title="Tema Oscuro"
                            >
                                <i class="fa-solid fa-moon"></i>
                            </button>
                            <button 
                                class="theme-btn ${theme === 'light' ? 'active' : ''}" 
                                onClick=${() => setTheme('light')}
                                title="Tema Claro"
                            >
                                <i class="fa-solid fa-sun"></i>
                            </button>
                            <button 
                                class="theme-btn ${theme === 'pastel' ? 'active' : ''}" 
                                onClick=${() => setTheme('pastel')}
                                title="Tema Pastel"
                            >
                                <i class="fa-solid fa-palette"></i>
                            </button>
                        </div>
                        
                        <!-- User Menu Dropdown (Active to the right of #themeSelector) -->
                        <div class="user-menu-container" ...${getDevProps('#menuUsuario', 'Menú de Usuario')}>
                            <div 
                                class="user-menu-btn ${menuOpen ? 'active' : ''}" 
                                onClick=${handleUserMenuClick}
                            >
                                <div class="user-avatar">DT</div>
                                <span class="user-name">Diego Torres</span>
                                <i class="fa-solid fa-chevron-down user-chevron"></i>
                            </div>

                            ${menuOpen && html`
                                <div class="user-dropdown-panel" onClick=${(e) => e.stopPropagation()}>
                                    <div class="dropdown-header-info">
                                        <div class="user-avatar" style=${{ width: '36px', height: '36px', fontSize: '14px' }}>DT</div>
                                        <div class="dropdown-info-text">
                                            <span class="dropdown-info-name">Diego Torres</span>
                                            <span class="dropdown-info-role">Administrador</span>
                                        </div>
                                    </div>
                                    <ul class="dropdown-menu-list">
                                        <li>
                                            <a class="dropdown-item" href="#profile" onClick=${() => setMenuOpen(false)}>
                                                <i class="fa-regular fa-user"></i>
                                                Mi Perfil
                                            </a>
                                        </li>
                                        <li>
                                            <a class="dropdown-item" href="#settings" onClick=${() => setMenuOpen(false)}>
                                                <i class="fa-solid fa-sliders"></i>
                                                Configuración
                                            </a>
                                        </li>
                                        <li>
                                            <a class="dropdown-item" href="#admin" onClick=${() => setMenuOpen(false)}>
                                                <i class="fa-solid fa-shield-halved"></i>
                                                Panel de Admin
                                            </a>
                                        </li>
                                        <li class="dropdown-divider"></li>
                                        <li>
                                            <a class="dropdown-item dropdown-item-danger" href="#logout" onClick=${() => setMenuOpen(false)}>
                                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                                                Cerrar Sesión
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
                
                <div class="workspace-container">
                    <!-- Map Workspace Panel -->
                    <div class="map-workspace" style=${{ display: view === 'map' ? 'block' : 'none' }} ...${getDevProps('#mapWorkspace', 'Contenedor del Mapa')}>
                        <!-- Left Controls Overlays (Kepler Style) -->
                        <div class="kepler-sidebar" ...${getDevProps('#keplerSidebar', 'Barra Lateral (Capas y Filtros)')}>
                            <div class="kepler-sidebar-header">
                                <h3><i class="fa-solid fa-sliders"></i> Capas y Filtros</h3>
                            </div>
                            
                            <div class="kepler-sidebar-body">
                                <div class="control-section" ...${getDevProps('#visualLayersSection', 'Capas Visuales')}>
                                    <h4>Capas Visuales</h4>
                                    
                                    <label class="layer-toggle">
                                        <span>Marcadores</span>
                                        <input 
                                            type="checkbox" 
                                            checked=${layers.points} 
                                            onChange=${(e) => setLayers(prev => ({ ...prev, points: e.target.checked }))} 
                                        />
                                    </label>
                                    
                                    <label class="layer-toggle">
                                        <span>Mapa de Calor</span>
                                        <input 
                                            type="checkbox" 
                                            checked=${layers.heatmap} 
                                            onChange=${(e) => setLayers(prev => ({ ...prev, heatmap: e.target.checked }))} 
                                        />
                                    </label>
                                    
                                    <label class="layer-toggle">
                                        <span>Grilla Hexagonal</span>
                                        <input 
                                            type="checkbox" 
                                            checked=${layers.hexbin} 
                                            onChange=${(e) => setLayers(prev => ({ ...prev, hexbin: e.target.checked }))} 
                                        />
                                    </label>
                                    
                                    <label class="layer-toggle">
                                        <span>Barrios (Coropletas)</span>
                                        <input 
                                            type="checkbox" 
                                            checked=${layers.choropleth} 
                                            onChange=${(e) => setLayers(prev => ({ ...prev, choropleth: e.target.checked }))} 
                                        />
                                    </label>
                                    
                                    <label class="layer-toggle">
                                        <span>Simulación 3D Extruida</span>
                                        <input 
                                            type="checkbox" 
                                            checked=${layers.extrusion3D} 
                                            onChange=${(e) => setLayers(prev => ({ ...prev, extrusion3D: e.target.checked }))} 
                                        />
                                    </label>
                                </div>
                                
                                <div class="control-section" ...${getDevProps('#attributeFiltersSection', 'Filtros de Atributo')}>
                                    <h4>Filtros de Atributo</h4>
                                    
                                    <div class="filter-group">
                                        <div class="filter-label-row">
                                            <span>Suelo Máx (u$s)</span>
                                            <strong>${priceFilter.toLocaleString()}</strong>
                                        </div>
                                        <input 
                                            type="range" 
                                            class="filter-slider" 
                                            min="100000" 
                                            max="1500000" 
                                            step="50000"
                                            value=${priceFilter} 
                                            onChange=${(e) => setPriceFilter(parseInt(e.target.value))} 
                                        />
                                    </div>
                                    
                                    <div class="filter-group">
                                        <div class="filter-label-row">
                                            <span>Área Mín (m²)</span>
                                            <strong>${areaFilter} m²</strong>
                                        </div>
                                        <input 
                                            type="range" 
                                            class="filter-slider" 
                                            min="50" 
                                            max="300" 
                                            step="10"
                                            value=${areaFilter} 
                                            onChange=${(e) => setAreaFilter(parseInt(e.target.value))} 
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Map Leaflet Canvas -->
                        <div ref=${mapContainerRef} class="leaflet-container" ...${getDevProps('#leafletContainer', 'Lienzo del Mapa Leaflet')}></div>
                    </div>
                    
                    <!-- Table Workspace Panel -->
                    <div class="table-workspace" style=${{ display: view === 'table' ? 'block' : 'none' }} ...${getDevProps('#tableWorkspace', 'Contenedor de la Tabla')}>
                        <div class="table-toolbar" ...${getDevProps('#tableToolbar', 'Barra de Herramientas')}>
                            <div class="search-wrapper" ...${getDevProps('#tableSearch', 'Buscador de Tabla')}>
                                <i class="fa-solid fa-magnifying-glass"></i>
                                <input 
                                    type="text" 
                                    class="table-search-input" 
                                    placeholder="Buscar por ID, etiqueta o barrio..." 
                                    value=${searchQuery}
                                    onChange=${(e) => setSearchQuery(e.target.value)}
                                />
                            </div>
                            
                            <div style=${{ fontSize: '13px', color: 'var(--text-muted)' }}>
                                <i class="fa-solid fa-circle-info" style=${{ marginRight: '6px' }}></i>
                                Haga doble clic sobre una celda para editar el valor de Suelo, Área o Destino
                            </div>
                        </div>
                        
                        <div class="grid-container" ...${getDevProps('#tableGridContainer', 'Contenedor de la Grilla')}>
                            <table class="premium-grid" ...${getDevProps('#premiumGrid', 'Grilla de Parcelas')}>
                                <thead>
                                    <tr>
                                        <th onClick=${() => handleSort('id')}>ID ${sortField === 'id' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                                        <th onClick=${() => handleSort('label')}>Etiqueta ${sortField === 'label' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                                        <th onClick=${() => handleSort('barrio')}>Barrio ${sortField === 'barrio' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                                        <th onClick=${() => handleSort('area')}>Área ${sortField === 'area' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                                        <th onClick=${() => handleSort('valorSuelo')}>Valor Suelo ${sortField === 'valorSuelo' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                                        <th>Valor m²</th>
                                        <th onClick=${() => handleSort('destino')}>Destino ${sortField === 'destino' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${sortedData.length === 0 ? html`
                                        <tr>
                                            <td colspan="7" style=${{ textAlign: 'center', padding: '40px', color: 'var(--text-muted)' }}>
                                                No se encontraron parcelas que coincidan con los filtros aplicados.
                                            </td>
                                        </tr>
                                    ` : sortedData.map(item => html`
                                        <tr key=${item.id}>
                                            <td style=${{ fontWeight: '600', color: 'var(--accent-primary)' }}>${item.id}</td>
                                            <td title=${item.entity} style=${{ maxWidth: '200px' }}>${item.label}</td>
                                            <td>${item.barrio}</td>
                                            <td class="editable-cell" onDoubleClick=${() => handleCellDoubleClick(item.id, 'area', item.area)}>
                                                ${editingCell?.id === item.id && editingCell?.field === 'area' ? html`
                                                    <input 
                                                        type="number"
                                                        class="cell-edit-input"
                                                        value=${editValue}
                                                        onChange=${(e) => setEditValue(e.target.value)}
                                                        onBlur=${handleCellSave}
                                                        onKeyDown=${(e) => e.key === 'Enter' && handleCellSave()}
                                                        autoFocus
                                                    />
                                                ` : `${item.area} m²`}
                                            </td>
                                            <td class="editable-cell" onDoubleClick=${() => handleCellDoubleClick(item.id, 'valorSuelo', item.valorSuelo)}>
                                                ${editingCell?.id === item.id && editingCell?.field === 'valorSuelo' ? html`
                                                    <input 
                                                        type="number"
                                                        class="cell-edit-input"
                                                        value=${editValue}
                                                        onChange=${(e) => setEditValue(e.target.value)}
                                                        onBlur=${handleCellSave}
                                                        onKeyDown=${(e) => e.key === 'Enter' && handleCellSave()}
                                                        autoFocus
                                                    />
                                                ` : `u$s ${item.valorSuelo.toLocaleString()}`}
                                            </td>
                                            <td style=${{ fontFamily: 'monospace', fontWeight: '600' }}>
                                                u$s ${Math.round(item.valorSuelo / item.area).toLocaleString()}
                                            </td>
                                            <td class="editable-cell" onDoubleClick=${() => handleCellDoubleClick(item.id, 'destino', item.destino)}>
                                                ${editingCell?.id === item.id && editingCell?.field === 'destino' ? html`
                                                    <select 
                                                        class="cell-edit-input"
                                                        value=${editValue}
                                                        onChange=${(e) => setEditValue(e.target.value)}
                                                        onBlur=${handleCellSave}
                                                        onKeyDown=${(e) => e.key === 'Enter' && handleCellSave()}
                                                        autoFocus
                                                    >
                                                        <option value="Residencial">Residencial</option>
                                                        <option value="Comercial">Comercial</option>
                                                        <option value="Baldío">Baldío</option>
                                                    </select>
                                                ` : html`<span class="cell-badge badge-${item.destino.toLowerCase()}">${item.destino}</span>`}
                                            </td>
                                        </tr>
                                    `)}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Knowledge Graph Inspector Workspace Panel -->
                    <${GraphInspectorPanel}
                        visible=${view === 'graph'}
                        repo=${activeRepo}
                        devProps=${getDevProps}
                    />

                    <!-- Rename Modal Dialog -->
                    ${activeDialog && html`
                        <div class="md-dialog-overlay">
                            <div class="md-dialog-card">
                                <h3 class="md-dialog-title">
                                    <i class="fa-solid fa-tags" style=${{ color: 'var(--accent-primary)' }}></i>
                                    Renombrar Componente
                                </h3>
                                <div style=${{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                                    <p style=${{ fontSize: '13px', color: 'var(--text-secondary)', margin: 0 }}>
                                        Asigne un alias personalizado para facilitar la identificación de este elemento:
                                    </p>
                                    
                                    <div class="md-input-group">
                                        <label>Alias Personalizado:</label>
                                        <input 
                                            type="text" 
                                            class="md-text-field" 
                                            value=${dialogInput}
                                            onChange=${(e) => setDialogInput(e.target.value)}
                                            placeholder="Ej. #chartsCard (Sección Gráficos)"
                                            autoFocus
                                        />
                                    </div>
                                    
                                    <div style=${{ fontSize: '12px', color: 'var(--text-muted)' }}>
                                        <div><strong>ID Original:</strong> ${activeDialog.id}</div>
                                        <div><strong>Nombre original:</strong> ${activeDialog.component}</div>
                                    </div>
                                </div>

                                <div class="md-dialog-actions">
                                    <button class="md-btn md-btn-text" onClick=${() => setActiveDialog(null)}>Cancelar</button>
                                    ${activeDialog.customName && html`
                                        <button class="md-btn md-btn-danger" onClick=${handleResetAlias}>Restablecer</button>
                                    `}
                                    <button class="md-btn md-btn-filled" onClick=${handleSaveAlias}>Guardar</button>
                                </div>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
